<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DropBridge · Files & clipboard</title><link rel="stylesheet" href="/shell.css"><script defer src="/shell.js"></script></head>
<body><header><div><a class="brand" href="/">↗ DropBridge</a><p>Two ways to share. One place to connect.</p></div><span class="badge">Local · Peer to peer</span></header>
<main><nav aria-label="Sharing tools"><button id="files-tab" aria-pressed="true">↗ Files <span>Dropno</span></button><button id="clipboard-tab" aria-pressed="false">▤ Clipboard <span>ClipboardBridge</span></button></nav><p class="hint">Pair each tool with your other device. Switching tools keeps both sessions open.</p><iframe id="files" title="Dropno file transfer" src="/files/" allow="clipboard-read; clipboard-write; screen-wake-lock"></iframe><iframe id="clipboard" title="ClipboardBridge text sharing" src="/clipboard/" allow="clipboard-read; clipboard-write" hidden></iframe></main>
